[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-shared"
version = "0.1.0"
description = "Shared configuration, logging and contracts for the Black Smoke Monitor API and worker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[tool.setuptools.packages.find]
include = ["smoke_shared*"]
